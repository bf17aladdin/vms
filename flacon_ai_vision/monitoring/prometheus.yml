global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "falcon_ai_vision_monitoring"

scrape_configs:
  - job_name: "falcon_ai_vision_app"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "app:5003"
          - "app_2:5003"
          - "ai_service:5003"
          - "ai_service_gpu:5003"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "mysql"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["mysqld_exporter:9104"]

  - job_name: "redis"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: "nginx"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["nginx_exporter:9113"]

  - job_name: "node"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "cadvisor"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
