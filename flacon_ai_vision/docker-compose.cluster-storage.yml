services:
  # Distributed MinIO cluster (4 nodes)
  minio1:
    image: quay.io/minio/minio:latest
    container_name: falcon-ai-vision-minio1
    command: server --console-address ":9001" http://minio{1...4}/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio1_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    networks:
      - falcon-ai-vision-network

  minio2:
    image: quay.io/minio/minio:latest
    container_name: falcon-ai-vision-minio2
    command: server --console-address ":9001" http://minio{1...4}/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio2_data:/data
    restart: unless-stopped
    networks:
      - falcon-ai-vision-network

  minio3:
    image: quay.io/minio/minio:latest
    container_name: falcon-ai-vision-minio3
    command: server --console-address ":9001" http://minio{1...4}/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio3_data:/data
    restart: unless-stopped
    networks:
      - falcon-ai-vision-network

  minio4:
    image: quay.io/minio/minio:latest
    container_name: falcon-ai-vision-minio4
    command: server --console-address ":9001" http://minio{1...4}/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio4_data:/data
    restart: unless-stopped
    networks:
      - falcon-ai-vision-network

  minio_init:
    image: quay.io/minio/mc:latest
    container_name: falcon-ai-vision-minio-init
    depends_on:
      - minio1
      - minio2
      - minio3
      - minio4
    entrypoint: >
      /bin/sh -c "
      until mc alias set falcon http://minio1:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123}; do
        echo 'waiting for minio cluster...';
        sleep 2;
      done;
      mc mb -p falcon/${MINIO_BUCKET:-falcon-ai-vision} || true;
      mc anonymous set none falcon/${MINIO_BUCKET:-falcon-ai-vision} || true;
      echo 'minio cluster initialized';
      "
    restart: "no"
    networks:
      - falcon-ai-vision-network

volumes:
  minio1_data:
  minio2_data:
  minio3_data:
  minio4_data:

networks:
  falcon-ai-vision-network:
    driver: bridge
